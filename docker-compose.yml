version: '3.8'

services:
  nav2_dev:
    image: nav2_student:humble
    build:
      context: .
      dockerfile: Dockerfile
      # build.sh sets these to the host user's ids so files written into the
      # bind mounts stay editable on the host.
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    container_name: nav2_workspace
    network_mode: host
    privileged: true
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - TURTLEBOT3_MODEL=waffle
      - ROS_DOMAIN_ID=0
      #NVIDIA GPU
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - __GLX_VENDOR_LIBRARY_NAME=nvidia
      - __NV_PRIME_RENDER_OFFLOAD=1
    volumes:
      # Persistent workspace
      - ./ros2_ws:/ros2_ws
      # X11 for GUI applications
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${HOME}/.Xauthority:/home/student/.Xauthority:ro
      # Shared resources
      - ./shared:/shared
    stdin_open: true
    tty: true
    command: /bin/bash
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
